# ---------------------------------------------------------------------------
# Daily Morning Edition
#
# Every morning GitHub runs this recipe for you, for free:
#   1. fetch today's stories from the public RSS feeds   (scripts/fetch_news.py)
#   2. save them as small data files in docs/data/        (committed to the repo)
#   3. publish the website to GitHub Pages
#
# You can also run it by hand: repo > Actions > "Daily Morning Edition" > Run workflow.
# ---------------------------------------------------------------------------
name: Daily Morning Edition

on:
  schedule:
    # Times are in UTC. "30 0 * * *" = 00:30 UTC = 06:00 in India (IST).
    # See README "Change the delivery time" for a conversion table.
    # (GitHub may start scheduled jobs a few minutes late - that is normal.)
    - cron: "30 0 * * *"
  workflow_dispatch:        # the manual "Run workflow" button
  push:
    branches: [main]        # also rebuild when you edit feeds.json or the site
    paths:
      - "scripts/**"
      - "docs/index.html"
      - "docs/assets/**"
      - ".github/workflows/daily.yml"

# Only one run at a time, so two runs never fight over the same files.
concurrency:
  group: morning-edition
  cancel-in-progress: false

permissions:
  contents: write     # lets the robot save docs/data/*.json back to the repo
  pages: write        # lets it publish the website
  id-token: write     # required by the official Pages deploy action

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Get the repository files
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install the two small libraries we need
        run: pip install -r scripts/requirements.txt

      - name: Check the helper code still works (offline self-tests)
        run: python -m unittest scripts/test_fetcher.py

      - name: Fetch today's edition
        # Exits with an error ONLY if zero articles were fetched. A few broken
        # feeds are fine: they are skipped and listed at the bottom of the page.
        run: python scripts/fetch_news.py

      - name: Save the new edition into the repository
        run: |
          git config user.name  "morning-edition-bot"
          git config user.email "morning-edition-bot@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -m "Edition for $(date -u +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi

      - name: Prepare the website for publishing
        uses: actions/configure-pages@v5

      - name: Package the website folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

