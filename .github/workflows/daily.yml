# =============================================================================
# Daily Morning Edition
#
# Automated workflow that runs every morning:
#   1. Runs offline self-tests and fetches stories from public RSS feeds
#   2. Commits the generated JSON data files to docs/data/
#   3. Builds and deploys the updated site to GitHub Pages
#
# Manual trigger: Actions tab -> "Daily Morning Edition" -> "Run workflow"
# =============================================================================

name: Daily Morning Edition

on:
  schedule:
    # Schedules use UTC. "30 0 * * *" = 00:30 UTC = 06:00 AM IST (India).
    # See README "Changing Delivery Time" for other timezones.
    - cron: "30 0 * * *"

  workflow_dispatch: # Enables the manual "Run workflow" button in GitHub Actions

  push:
    branches: [main] # Automatically rebuilds when code, feeds, or workflow files change
    paths:
      - "scripts/**"
      - "docs/index.html"
      - "docs/assets/**"
      - ".github/workflows/daily.yml"

# Prevent overlapping runs from creating Git merge conflicts
concurrency:
  group: morning-edition
  cancel-in-progress: false

# Required permissions to commit generated data and deploy to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: Fetch & Build Edition
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run offline unit tests
        run: python -m unittest scripts/test_fetcher.py

      - name: Fetch today's edition
        # Fails only if zero articles are fetched across all feeds.
        # Individual broken feeds are skipped and logged at the bottom of the page.
        run: python scripts/fetch_news.py

      - name: Save the new edition
        run: |
          git config --local user.name "morning-edition-bot"
          git config --local user.email "morning-edition-bot@users.noreply.github.com"
          git add docs/data/
          if git diff --cached --quiet; then
            echo "No new edition changes to commit."
          else
            git commit -m "chore: edition for $(date -u +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name:
