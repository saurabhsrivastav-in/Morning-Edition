name: Daily Morning Edition

on:
  schedule:
    - cron: "30 0 * * *"

  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "docs/index.html"
      - "docs/assets/**"
      - ".github/workflows/daily.yml"

concurrency:
  group: morning-edition
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: Fetch & Build Edition
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run offline unit tests
        run: python -m unittest scripts/test_fetcher.py

      - name: Fetch today's edition
        run: python scripts/fetch_news.py

      - name: Save the new edition
        run: |
          git config --local user.name "morning-edition-bot"
          git config --local user.email "morning-edition-bot@users.noreply.github.com"
          git add docs/data/
          if git diff --cached --quiet; then
            echo "No new edition changes to commit."
          else
            git commit -m "chore: edition for $(date -u +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
- name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 requests lxml
          pip install -r scripts/requirements.txt
